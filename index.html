<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet Catcher</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --border: #23314f;
    --text: #d6e2f0;
    --muted: #8193b2;
    --green: #22c55e;
    --red: #ef4444;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .game { width: 100%; max-width: 480px; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: 1px; text-align: center; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
  }
  .hud .lives { color: var(--red); letter-spacing: 2px; }
  .hud .lives .lost { color: var(--border); }
  .stage { position: relative; border: 1px solid var(--border); border-radius: 0 0 8px 8px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 480 / 640; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    background: rgba(11, 18, 32, 0.82);
    padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: var(--muted); }
  .overlay .final { color: var(--text); font-size: 20px; }
  .overlay .record { color: var(--accent); font-size: 20px; font-weight: bold; }
  .hud .best { color: var(--accent); }
  .overlay button {
    font: inherit;
    font-size: 18px;
    padding: 10px 28px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #1a1204;
    cursor: pointer;
  }
  .overlay button:hover { filter: brightness(1.1); }
  .legend { margin-top: 10px; color: var(--muted); font-size: 14px; text-align: center; }
  .legend .g { color: var(--green); }
  .legend .r { color: var(--red); }
</style>
</head>
<body>
<main class="game">
  <h1>PACKET CATCHER</h1>
  <div class="hud" aria-live="polite">
    <span>Score: <strong id="score">0</strong></span>
    <span class="best">Best: <strong id="best">0</strong></span>
    <span>Lives: <span id="lives" class="lives"></span></span>
  </div>
  <div class="stage">
    <canvas id="board" width="480" height="640" aria-label="Packet Catcher game area"></canvas>

    <div id="start-screen" class="overlay">
      <h2>Packet Catcher</h2>
      <p>Move the firewall with <strong>&larr;</strong> <strong>&rarr;</strong></p>
      <p><span style="color:var(--green)">Catch green packets</span> for points.<br>
         <span style="color:var(--red)">Avoid red packets</span>: each one costs a life.</p>
      <p class="final">High score: <strong id="start-best">0</strong></p>
      <button id="start-btn" type="button">Start</button>
      <p>or press Enter</p>
    </div>

    <div id="gameover-screen" class="overlay" hidden>
      <h2>Game Over</h2>
      <p class="final">Final score: <strong id="final-score">0</strong></p>
      <p id="gameover-msg"></p>
      <button id="restart-btn" type="button">Restart</button>
      <p>or press Enter</p>
    </div>
  </div>
  <p class="legend"><span class="g">■ OK</span> = +1 point &nbsp; <span class="r">■ X</span> = &minus;1 life</p>
</main>

<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
